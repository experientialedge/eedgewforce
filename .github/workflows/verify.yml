name: Verify web app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm test
      - run: npm run build
      - run: node --test server/src/tests/cpanel_hosting.test.js
      - run: npm run package:cpanel
      - run: npm audit --omit=dev --audit-level=high
